services:
  web:
    image: ${WERKBLATT_IMAGE:?WERKBLATT_IMAGE mit unveraenderlichem Tag oder Digest setzen}
    container_name: werkblatt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      PRETIX_API_TOKEN_FILE: /run/secrets/pretix_api_token
      WEBDAV_PASSWORD_FILE: /run/secrets/webdav_password
    secrets:
      - django_secret_key
      - postgres_password
      - oidc_client_secret
      - pretix_api_token
      - webdav_password
    expose:
      - "8000"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp/werkblatt:rw,noexec,nosuid,nodev,size=268435456,mode=1777
    volumes:
      - /srv/zircula/werkblatt/media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          urllib.request.Request('http://127.0.0.1:8000/ready/',
          headers={'Host':'werkblatt.zircula.org'}), timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db:
    image: ${WERKBLATT_POSTGRES_IMAGE:?WERKBLATT_POSTGRES_IMAGE mit Digest setzen}
    container_name: werkblatt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: werkblatt
      POSTGRES_USER: werkblatt
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    read_only: true
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,size=16777216,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    volumes:
      - /srv/zircula/werkblatt/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkblatt -d werkblatt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  frontend:
    external: true
    name: zircula_frontend
  internal:
    name: werkblatt_internal
    internal: true

secrets:
  django_secret_key:
    file: /srv/zircula/werkblatt/secrets/django_secret_key
  postgres_password:
    file: /srv/zircula/werkblatt/secrets/postgres_password
  oidc_client_secret:
    file: /srv/zircula/werkblatt/secrets/oidc_client_secret
  pretix_api_token:
    file: /srv/zircula/werkblatt/secrets/pretix_api_token
  webdav_password:
    file: /srv/zircula/werkblatt/secrets/webdav_password
