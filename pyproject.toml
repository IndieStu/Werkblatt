[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "werkblatt"
version = "0.1.0"
description = "Open-source workshop documentation for associations and educational organizations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Authlib>=1.6,<2",
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/werkblatt"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
