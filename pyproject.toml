[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "werkblatt"
version = "0.1.0rc2"
description = "Open-source workshop documentation for associations and educational organizations."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Timo Hecken" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
  "Authlib>=1.6,<2",
  "CairoSVG>=2.8,<3",
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "Pillow>=12.3,<13",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "reportlab>=4.4,<5",
  "weasyprint>=70,<71",
  "whitenoise[brotli]>=6.12,<7",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9,<3",
  "pypdf>=6,<7",
  "PyMuPDF>=1.26,<2",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/werkblatt"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.env.example",
  "/.github",
  "/.gitignore",
  "/BRAND_POLICY.md",
  "/CHANGELOG.md",
  "/CONTAINER_BASE_IMAGES.lock",
  "/Dockerfile",
  "/LICENSE",
  "/NOTICE.md",
  "/README.md",
  "/THIRD_PARTY_LICENSES.md",
  "/THIRD_PARTY_LICENSES.lock.sha256",
  "/compose.yaml",
  "/CONTRIBUTING.md",
  "/config",
  "/docs",
  "/licenses",
  "/manage.py",
  "/pyproject.toml",
  "/src",
  "/static",
  "/templates",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = ["security: adversarial security and tenant-isolation tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
